name: Tests (unit, integration, e2e)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# published dispatcher postinstall runs `cds env get` during npm ci; cds 10 emits a non-JSON inspect dump under GITHUB_ACTIONS unless NO_COLOR is set
env:
  NO_COLOR: '1'

jobs:
  lint:
    name: Lint (eslint, prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint, prettier)
        run: npm run check

  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run coverage (enforces thresholds)
        run: npm run test:coverage

  verifier:
    name: Postinstall verifier
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Assert agent-facing JSDoc survives into dist/index.d.ts
        run: |
          COUNT=$(grep -c "@example" dist/index.d.ts)
          echo "Found $COUNT @example blocks in dist/index.d.ts"
          test "$COUNT" -ge 120
          grep -q "silently inert" dist/index.d.ts
          grep -q "experimentalDecorators" dist/index.d.ts
          grep -q "drop the backslash" dist/index.d.ts

      - name: Verify @dispatcher folder, index.ts file, and content
        run: npm run test:verifier

      - name: Verify @dispatcher folder, index.ts file, and content in monorepo projects
        run: npm run test:verifier:monorepo

  test-e2e:
    name: End-to-end (e2e)
    strategy:
      matrix:
        version: [24, 22]
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start server and start e2e tests
        run: npm run test:e2e

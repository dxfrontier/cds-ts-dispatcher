name: Deployment

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

# published dispatcher postinstall runs `cds env get` during npm ci; cds 10 emits a non-JSON inspect dump under GITHUB_ACTIONS unless NO_COLOR is set
env:
  NO_COLOR: '1'

jobs:
  # This will validate that the PR was actually merged (not just closed) and labeled 'deploy' - otherwise the release will not happen
  check_valid_deploy:
    name: Validate deploy conditions
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Proceed valid"

    # This will start build of the project
  check_valid_build:
    name: Check build validity
    runs-on: ubuntu-latest
    needs: [check_valid_deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  # This will push the latest build of the project to npm
  publish-npm:
    name: Publish to npm public
    needs: check_valid_build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      # npm provenance needs npm 9.5+ and a CI OIDC-compatible token; if the org's NPM_ORG_TOKEN is incompatible with provenance, drop the --provenance flag
      # repo-level NPM_TOKEN (classic token) was revoked in npm's Dec 2025 token purge; publishing auth lives in the org-level NPM_ORG_TOKEN granular token
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_ORG_TOKEN}}
